name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. 0.9.1). Used only for manual dispatch.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os_label }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            os_label: linux
            arch: x86_64
          - runner: ubuntu-22.04-arm
            os_label: linux
            arch: aarch64
          - runner: macos-13
            os_label: darwin
            arch: x86_64
          - runner: macos-14
            os_label: darwin
            arch: aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "stage=mallet-${tag}-${{ matrix.os_label }}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install zstd

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libzstd-dev

      # Roswell is installed first because:
      #   1. Its sbcl-bin acts as the bootstrap host for `sh make.sh`
      #      (GitHub-hosted ubuntu/macos runners ship no system SBCL).
      #   2. We need it later for qlot.
      - name: Install Roswell + sbcl-bin (host SBCL for source build)
        env:
          LISP: sbcl-bin
        run: |
          curl -L https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | sh
          host_sbcl="$(find "$HOME/.roswell/impls" -name sbcl -type f -perm -u+x | head -1)"
          [ -n "$host_sbcl" ] || { echo "ERROR: Roswell did not install sbcl-bin" >&2; exit 1; }
          echo "ROSWELL_HOST_SBCL=$host_sbcl" >> "$GITHUB_ENV"
          echo "ROSWELL_HOST_SBCL_HOME=$(dirname "$(dirname "$host_sbcl")")/lib/sbcl" >> "$GITHUB_ENV"

      - name: Build SBCL from source with static libzstd
        env:
          SBCL_VERSION: 2.6.0
        run: |
          set -eu
          case "${{ matrix.os_label }}-${{ matrix.arch }}" in
            darwin-aarch64) zstd_a=/opt/homebrew/lib/libzstd.a;          config=Config.arm64-darwin  ;;
            darwin-x86_64)  zstd_a=/usr/local/lib/libzstd.a;             config=Config.x86-64-darwin ;;
            linux-aarch64)  zstd_a=/usr/lib/aarch64-linux-gnu/libzstd.a; config=Config.arm64-linux   ;;
            linux-x86_64)   zstd_a=/usr/lib/x86_64-linux-gnu/libzstd.a;  config=Config.x86-64-linux  ;;
            *) echo "unsupported: ${{ matrix.os_label }}-${{ matrix.arch }}" >&2; exit 1 ;;
          esac
          [ -f "$zstd_a" ] || { echo "ERROR: missing static archive: $zstd_a" >&2; exit 1; }

          # Use Roswell's sbcl-bin as the bootstrap host for make.sh.
          export PATH="$(dirname "$ROSWELL_HOST_SBCL"):$PATH"
          export SBCL_HOME="$ROSWELL_HOST_SBCL_HOME"
          sbcl --version

          mkdir -p /tmp/sbcl-build
          cd /tmp/sbcl-build
          curl -fsSL -o sbcl-source.tar.bz2 \
            "https://sourceforge.net/projects/sbcl/files/sbcl/${SBCL_VERSION}/sbcl-${SBCL_VERSION}-source.tar.bz2/download"
          tar xjf sbcl-source.tar.bz2
          cd "sbcl-${SBCL_VERSION}"
          # Replace dynamic -lzstd with the static archive so the resulting
          # SBCL runtime has no libzstd dynamic dependency.
          sed -i.bak "s|-lzstd|${zstd_a}|" "src/runtime/${config}"
          sh make.sh --fancy
          # install.sh refuses to run while SBCL_HOME is set (it would point
          # at the host SBCL, not the freshly built one). Drop it.
          unset SBCL_HOME
          sudo INSTALL_ROOT=/usr/local sh install.sh

      - name: Pin /usr/local/bin/sbcl ahead of Roswell on PATH
        run: |
          # /usr/local first so the source-built sbcl wins; SBCL_HOME for the
          # host build is no longer relevant (the new sbcl finds its own core).
          echo "/usr/local/bin"      >> "$GITHUB_PATH"
          echo "$HOME/.roswell/bin"  >> "$GITHUB_PATH"
          echo "SBCL_HOME=" >> "$GITHUB_ENV"

      - name: Verify SBCL has no dynamic libzstd dependency (macOS)
        if: runner.os == 'macOS'
        run: |
          set -eu
          otool -L "$(command -v sbcl)"
          if otool -L "$(command -v sbcl)" | grep -q libzstd; then
            echo "ERROR: SBCL still has dynamic libzstd dependency" >&2
            exit 1
          fi

      - name: Verify SBCL has no dynamic libzstd dependency (Linux)
        if: runner.os == 'Linux'
        run: |
          set -eu
          ldd "$(command -v sbcl)" || true
          if ldd "$(command -v sbcl)" | grep -q libzstd; then
            echo "ERROR: SBCL still has dynamic libzstd dependency" >&2
            exit 1
          fi

      - name: Install Qlot
        run: |
          ros install fukamachi/qlot
          ros install fukamachi/archive/fix/tar-symlink-entry

      - name: Verify sbcl on PATH is the source-built one
        run: |
          set -eu
          command -v sbcl
          if [ "$(command -v sbcl)" != "/usr/local/bin/sbcl" ]; then
            echo "ERROR: expected sbcl at /usr/local/bin/sbcl, got $(command -v sbcl)" >&2
            exit 1
          fi
          sbcl --version

      - name: Build, package, and verify
        env:
          MALLET_VERSION: ${{ steps.version.outputs.tag }}
          MALLET_OS: ${{ matrix.os_label }}
          MALLET_ARCH: ${{ matrix.arch }}
        run: |
          bash scripts/release-build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.stage }}
          path: |
            dist/${{ steps.version.outputs.stage }}.tar.gz
            dist/${{ steps.version.outputs.stage }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: meta
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect tarballs and compute SHA256SUMS
        run: |
          set -eu
          mkdir -p release
          find artifacts -type f -name '*.tar.gz' -exec cp {} release/ \;
          cd release
          ls -l
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/SHA256SUMS
